<style>

<script>
const tg = window.Telegram && Telegram.WebApp;
const $ = id => document.getElementById(id);
// Nov 12: on GitHub Pages the link says where the bot is (?api=https://...); here it is this server.
const API = (() => { const a = new URLSearchParams(location.search).get("api") || ""; return /^https:\/\/[^/?#]+$/.test(a) ? a : ""; })();
const HOSTED = !!API;
// Nov 16: demos come through the bot's permanent address (Cloudflare caches them close to the phone; GitHub Pages
// answered in 0.5-1.8 s from Kazakhstan); the copy on GitHub Pages stays as the fallback
function demoUrl(id, name) { return HOSTED ? (/reelsmontage\.com$/.test(API) ? `${API}/demo/${id}/${name}?d=light720-v1` : `demos/${id}/${name}`) : `/demo/${id}/${name}`; }
window.demoUrl = demoUrl;
const ICONS = {motion_pro: "⚡", explainer: "📊", animation: "🎬", duel: "⚔️"};
function icon(s) { const m = s.name.match(/^(\S+)\s+/); return m && !/[0-9A-Za-zА-яЁёӘәҒғҚқҢңӨөҰұҮүІіҺһ]/.test(m[1]) ? m[1] : (ICONS[s.id] || "✨"); }
function label(s) { const m = s.name.match(/^(\S+)\s+(.*)$/); return m && !/[0-9A-Za-zА-яЁёӘәҒғҚқҢңӨөҰұҮүІіҺһ]/.test(m[1]) ? m[2] : s.name; }
let D = null, T = {}, style = null, color = "gold", cur = null, dragging = false, cancelled = false, tfx = "auto";

function haptic(kind) { try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
function fmt(t) { t = Math.floor(t || 0); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
async function api(path, body) {
  // Nov 16: a lost connection (an old button with an old bot address) must show a message, never a black page
  try {
    const r = await fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    return await r.json().catch(() => ({ok: false}));
  } catch (e) { return {ok: false, offline: true}; }
}

async function boot() {
  if (tg) { try { tg.ready(); tg.expand(); if (tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.requestFullscreen();
    tg.setHeaderColor && tg.setHeaderColor("#000000"); tg.setBackgroundColor && tg.setBackgroundColor("#000000");
    tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }  // Nov 22: a swipe down shows the previous style, never closes the app
  D = await api("/api/init", {initData: tg ? tg.initData : ""});
  if (!D.ok) { $("empty").style.display = "flex"; $("empty").textContent = D.offline
    ? "Бұл батырма ескірген. Чатта /start басып, жаңа «🎬 Видео жіберу» батырмасын басыңыз · Кнопка устарела: нажмите /start в чате и откройте новую кнопку"
    : "Ботта /start басыңыз · Нажмите /start в боте"; return; }
  T = D.t; document.documentElement.lang = D.lang;
  // Nov 22: the home page's new words, in case the page is newer than the server for a few minutes
  const NEW = D.lang === "ru" ? {app_send_this: "Отправить видео в этом стиле", app_swipe_hint: "следующий стиль", app_act_demo: "Изменить демо",
    nav_styles: "Стили", nav_podcast: "Подкаст", nav_creative: "Креатив", nav_profile: "Профиль", pod_text: "/podcast https://youtube.com/...", pod_chat: "Перейти в чат", pod_soon: "Скоро здесь появится подкаст.", pod_ok: "Понятно"}
    : {app_send_this: "Осы стильде видео жіберу", app_swipe_hint: "келесі стиль", app_act_demo: "Демоны өзгерту", nav_styles: "Стильдер",
    nav_podcast: "Подкаст", nav_creative: "Креатив", nav_profile: "Профиль", pod_text: "/podcast https://youtube.com/...", pod_chat: "Чатқа өту", pod_soon: "Жақында мұнда подкаст бөлімі ашылады.", pod_ok: "Түсінікті"};
  Object.keys(NEW).forEach(k => { if (!T[k]) T[k] = NEW[k]; });
  // Nov 12: opened from the chat's "✏️ Түзету" (?order=1031): straight into the editor on that order
  const ORDER = new URLSearchParams(location.search).get("order") || "";
  if (/^\d{1,9}$/.test(ORDER)) {
    // Nov 13: a client correcting an order sees only the editor, never the demo page behind it
    document.head.insertAdjacentHTML("beforeend", "<style>#app.order-mode *{visibility:hidden}#app.order-mode #edit,#app.order-mode #edit *,#app.order-mode #empty{visibility:visible}</style>");
    $("app").classList.add("order-mode");
    $("empty").style.display = "flex"; $("empty").textContent = T.ed_preparing;
    try {
      await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = HOSTED ? "editor.js" : "/app/editor.js"; sc.onload = ok; sc.onerror = no; document.body.append(sc); });
      const failed = await openOrder(+ORDER);
      if (failed) $("empty").textContent = failed; else $("empty").style.display = "none";
    } catch (e) { $("empty").textContent = T.app_failed; }
    return;
  }
  if (HOSTED) {  // Nov 12: a version still rendering on the laptop is not on the site yet (a black screen)
    const have = await fetch("demos/manifest.json", {cache: "no-store"}).then(r => r.json()).catch(() => null);
    if (have) D.styles.forEach(s => { const f = have[s.id] || [];
      s.before = s.before && f.includes("before"); s.after = s.after && f.includes("after");
      s.colors = (s.colors || []).filter(c => f.includes("after_" + c)); s.looks = (s.looks || []).filter(x => f.includes("after_fx_" + x));
      s.tunes = Math.min(s.tunes || 0, ["music_1", "music_2", "music_3"].filter(x => f.includes(x)).length);
      s.plan = s.plan && f.includes("plan"); });
  }
  $("bBefore").textContent = T.app_before; $("bAfter").textContent = T.app_after;
  $("colorLbl").textContent = T.app_color; $("colorTitle").textContent = T.app_color; $("send").textContent = "🎬 " + T.app_send_this;
  setupMe(); $("tryText").textContent = T.app_act_demo;
  $("tryDemo").onclick = async () => {  // the editor's code arrives only when it is needed
    if (!window.openTry) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = HOSTED ? "editor.js" : "/app/editor.js"; sc.onload = ok; sc.onerror = no; document.body.append(sc); });
    openTry();
  };
  $("allTitle").textContent = T.app_all_styles; $("tarTitle").textContent = T.app_tariffs;
  $("balText").textContent = D.balance + " " + T.app_videos;
  $("tfxLbl").textContent = T.app_text_fx; $("tfxTitle").textContent = T.app_text_fx; $("tfxHint").textContent = T.app_text_fx_hint;
  $("tfxLine").onclick = () => { haptic(); openLooks(); };
  $("colorLine").onclick = () => { haptic(); open("colorSheet"); };
  D.creatives = D.styles.filter(s => s.creative); D.styles = D.styles.filter(s => !s.creative);
  renderRail(); renderColors(); renderTariffs(); renderLooks(); renderCreatives(); setupNav();
  pick(D.styles[0]);
  setupGuide();
  startWarm();
}

// ---------- Nov 22 (owner): the one-page guide. A client sees it at every opening (the demos load behind it);
// the admin never gets it by itself. «?» opens it again for anyone; X, the button or a tap outside closes it.
function setupGuide() {
  [["gdTitle", "gd_title"], ["gdLead", "gd_lead"], ["gdHow", "gd_how"], ["gdFilm", "gd_film"], ["gdOk", "gd_ok"], ["gdFoot", "gd_foot"],
   ["gdS1", "gd_s1"], ["gdS1s", "gd_s1_sub"], ["gdS2", "gd_s2"], ["gdS2s", "gd_s2_sub"], ["gdS3", "gd_s3"], ["gdS3s", "gd_s3_sub"],
   ["gdMore", "gd_more"], ["gdP", "gd_pod"], ["gdPs", "gd_pod_sub"], ["gdC", "gd_cre"], ["gdCs", "gd_cre_sub"],
   ["gdT1", "gd_t1"], ["gdT1s", "gd_t1_sub"], ["gdT2", "gd_t2"], ["gdT2s", "gd_t2_sub"], ["gdT3", "gd_t3"], ["gdT3s", "gd_t3_sub"],
   ["gdT4", "gd_t4"], ["gdT4s", "gd_t4_sub"]].forEach(([id, key]) => { $(id).textContent = T[key] || ""; });
  const hide = () => { haptic(); $("guide").classList.remove("show"); };
  $("gdX").onclick = hide; $("gdOk").onclick = hide;
  $("guide").onclick = e => { if (e.target === $("guide")) hide(); };
  $("help").onclick = () => { haptic(); $("guide").querySelector(".gdbox").scrollTop = 0; $("guide").classList.add("show"); };
  if (!D.admin) $("guide").classList.add("show");
}

// Nov 22 (owner, variant 5): the dots on the left edge, one per style; the full grid opens from «Стильдер»
function renderRail() {
  const dv = $("dotsv"); dv.innerHTML = "";
  D.styles.forEach(s => {
    const i = document.createElement("i"); i.dataset.id = s.id;
    i.onclick = e => { e.stopPropagation(); haptic(); pick(s); }; dv.append(i);
  });
  dv.style.display = D.styles.length > 1 ? "" : "none";
  const grid = $("grid"); grid.innerHTML = "";
  D.styles.forEach(s => {
    const c = document.createElement("div"); c.innerHTML = `<div class="dotst" data-id="${s.id}">${icon(s)}</div>`;
    c.append(document.createTextNode(label(s))); c.onclick = () => { pick(s); close(); }; grid.append(c);
  });

function putPart(url, piece, onBytes) {

    x.open("PUT", url);
    x.upload.onprogress = e => { if (e.loaded > last) { onBytes(e.loaded - last); last = e.loaded; } };
    x.onload = () => res({etag: x.status >= 200 && x.status < 300 ? x.getResponseHeader("ETag") : null, sent: last});
    x.onerror = x.onabort = x.ontimeout = () => res({etag: null, sent: last});

    + `<div><b>${esc(me.name)}</b>${me.username ? `<div class="u">@${esc(me.username)}</div>` : ""}<div class="i">ID: <em>${me.id}</em></div></div></div>`;
  if (me.left > 0) {
    h += `<div class="glass card2"><h4>${esc(T.pr_balance)}</h4><div class="balbig"><b>${me.left}</b><span>${esc(T.pr_left)} · «${esc(me.tariff)}» ${esc(T.pr_tariff_word)}</span></div>`
      + `<div class="meter"><i style="width:${Math.round(100 * me.left / Math.max(1, me.total))}%"></i></div></div>`;
  } else {
    h += `<div class="glass card2 nobal"><b>${esc(T.pr_no_tariff)}</b><span class="sm">${esc(T.pr_no_tariff_sub)}</span></div>`;
  }
  h += `<div class="glass card2"><h4>${esc(T.pr_made)} · ${me.madeTotal}</h4>`
    + (me.made.length ? `<div class="mchips">${me.made.map(m => `<span>${esc(m.style)} <b>${m.n}</b></span>`).join("")}</div>` : `<div class="sm">${esc(T.pr_none_made)}</div>`)
    + `<div class="sm">${esc(T.pr_in_chat)}</div></div>`;
  if (D.freeDay) h += `<div class="glass card2"><b>${esc(D.freeDay)}</b></div>`;  // Nov 22 free day
  h += `<div class="glass card2"><h4>${esc(me.left > 0 ? T.pr_buy_title : T.pr_choose)}</h4>${tariffRows(me)}<div class="hint2">♾️ ${T.pr_hint}</div></div>`;
  return h;
}
function wireTariffs(box) {
  box.querySelectorAll("[data-tar]").forEach(row => row.onclick = async () => {
    haptic("medium"); const r = await api("/api/tariff", {token: D.token, id: row.dataset.tar}); if (r.ok && tg) tg.close();
  });
}
async function openProfile(userId) {
  const r = userId ? await api("/api/admin/user", {token: D.token, id: userId}) : await api("/api/profile", {token: D.token});
  if (!r.ok) return;
  $("prBody").innerHTML = profileHtml(r.me, !userId);
  if (!userId) wireTariffs($("prBody")); else $("prBody").querySelectorAll("[data-tar]").forEach(x => x.style.cursor = "default");
  pgOpen("pgProfile");
  if (userId) adminJs().then(() => window.panelClient($("prBody"), userId)).catch(() => {});  // Nov 21: add videos, write, block
}
// Nov 21 (owner): «⚙️ Әкімші панелі» lives in admin.js, loaded only for the admin
let ADMJS = null;
function adminJs() {
  return ADMJS || (ADMJS = new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = HOSTED ? "admin.js" : "/app/admin.js";
    sc.onload = ok; sc.onerror = () => { ADMJS = null; no(); }; document.body.append(sc); }));
}
let ADM = null;
// Nov 16 (owner): «Тіркелген» opens everyone who pressed /start, newest first; tap = that person's profile
function drawAll() {
  const q = ($("allFind") ? $("allFind").value : "").trim().toLowerCase();
  const list = ADM.all.filter(u => !q || String(u.id).includes(q) || (u.name || "").toLowerCase().includes(q) || (u.username || "").toLowerCase().includes(q));
  $("allList").innerHTML = list.length ? list.map(u => `<div class="urow" data-uid="${u.id}"><div class="a" style="background:${HUES[u.id % HUES.length]}">${esc((u.name || "?").charAt(0).toUpperCase())}</div>`
    + `<div class="n"><b>${esc(u.name)}${u.username ? ` <span>@${esc(u.username)}</span>` : ""}</b><span>ID ${u.id} · ${esc(u.created)}</span></div>`
    + `<div class="c">${u.left > 0 ? `${u.left}<small>${esc(u.tariff)}</small>` : `<small>${esc(T.ad_no_tariff)}</small>`}</div></div>`).join("")
    : `<div class="none">${esc(T.ad_empty)}</div>`;
  $("allList").querySelectorAll("[data-uid]").forEach(x => x.onclick = () => { haptic(); openProfile(Number(x.dataset.uid)); });
}
function openAll() {
  $("allTitle2").textContent = `${T.ad_all} · ${ADM.all.length}`;
  $("allBody").innerHTML = `<input class="find glass" id="allFind" type="search" placeholder="🔎 ${esc(T.ad_search)}" style="margin-top:0">`
    + `<div class="col2 glass allrow" id="allList"></div>`;
  $("allFind").oninput = drawAll;
  drawAll();
  pgOpen("pgAll");
}
function userRows(list) {
  if (!list.length) return `<div class="none">${esc(T.ad_empty)}</div>`;
  return list.map(u => `<div class="urow" data-uid="${u.id}"><div class="a" style="background:${HUES[u.id % HUES.length]}">${esc((u.name || "?").charAt(0).toUpperCase())}</div>`
    + `<div class="n"><b>${esc(u.name)}</b><span>${u.total > 1 ? esc(u.tariff) : u.id}</span></div>`
    + `<div class="c">${u.total > 1 ? `${u.left}/${u.total}` : u.left}<small>${esc(T.ad_left)}</small></div></div>`).join("");
}
function drawAdminLists() {
  const q = ($("adFind") ? $("adFind").value : "").trim().toLowerCase();
  const keep = u => !q || String(u.id).includes(q) || (u.name || "").toLowerCase().includes(q);
  $("adTrial").innerHTML = userRows(ADM.trial.filter(keep)); $("adPaid").innerHTML = userRows(ADM.paid.filter(keep));
  $("pgAdmin").querySelectorAll("[data-uid]").forEach(x => x.onclick = () => { haptic(); openProfile(Number(x.dataset.uid)); });
}
// Nov 24 (owner): the real clients only (who blocked the bot drops out, who comes back is counted again), live
function goneLine(r) { return r.gone ? `${r.signed} − ${r.gone} ${esc(T.ad_gone)} = ${r.registered}` : ""; }
async function refreshAdmin() {
  const page = $("pgAdmin");
  if (document.hidden || !page || !page.classList.contains("show") || !$("adN")) return;
  const r = await api("/api/admin", {token: D.token}).catch(() => null);
  if (!r || !r.ok) return;
  ADM = r;
  $("adN").textContent = r.registered; $("adT").textContent = r.trial.length; $("adP").textContent = r.paid.length;
  $("adD").textContent = "+" + r.today; $("adGone").textContent = goneLine(r);
  drawAdminLists();
  if ($("pgAll").classList.contains("show")) { $("allTitle2").textContent = `${T.ad_all} · ${ADM.all.length}`; drawAll(); }
}
async function openAdmin() {
  const r = await api("/api/admin", {token: D.token});
  if (!r.ok) return;
  ADM = r;
  $("adBody").innerHTML = `<div class="stats4"><div class="glass tap" id="adAllBtn"><b id="adN">${r.registered}</b><span>${esc(T.ad_registered)}</span></div>`
    + `<div class="glass"><b id="adT">${r.trial.length}</b><span>${esc(T.ad_trial)}</span></div><div class="glass g"><b id="adP">${r.paid.length}</b><span>${esc(T.ad_paid)}</span></div>`
    + `<div class="glass"><b id="adD">+${r.today}</b><span>${esc(T.ad_today)}</span></div></div>`
    + `<div class="pnSm" id="adGone" style="margin:6px 4px 0;color:var(--muted);font-size:11.5px">${goneLine(r)}</div>`
    + `<input class="find glass" id="adFind" type="search" placeholder="🔎 ${esc(T.ad_search)}">`
    + `<div class="cols2"><div class="col2 glass"><h5>${esc(T.ad_trial)}<small>${esc(T.ad_trial_sub)}</small></h5><div id="adTrial"></div></div>`
    + `<div class="col2 glass"><h5>${esc(T.ad_paid_sub)}<small>${esc(D.tariffs.filter((x, i) => i > 0).map(x => x.name).join(" · "))}</small></h5><div id="adPaid"></div></div></div>`
    + `<div class="hint2" style="margin-top:12px">ℹ️ ${T.ad_hint}</div>`;
  $("adFind").oninput = drawAdminLists;
  $("adAllBtn").onclick = () => { haptic(); openAll(); };
  drawAdminLists();
  pgOpen("pgAdmin");
  if (!window._adTimer) window._adTimer = setInterval(refreshAdmin, 15000);
  adminJs().then(() => window.panelTiles($("adBody"))).catch(() => {});
}
boot();
</script>
