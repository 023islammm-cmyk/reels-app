<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Reels Монтаж</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#FFD15C;--muted:rgba(255,255,255,.62);
  --top:max(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px), env(safe-area-inset-top,0px));
  --bottom:max(var(--tg-safe-area-inset-bottom,0px), env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
button{font-family:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.glow{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(30px) saturate(1.5) brightness(.5);transform:scale(1.25)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.06));backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 30px rgba(0,0,0,.25)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.glass{background:rgba(28,28,30,.88)}}
.stage{position:absolute;top:0;left:0;right:0;height:75%;border-radius:0 0 30px 30px;overflow:hidden;background:#111;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transition:opacity .4s;background:#111}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:30px}
.top{position:absolute;top:calc(var(--top) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;z-index:4}
.pill{border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;cursor:pointer}
.gold{color:var(--gold)}
.play{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer;transition:opacity .3s,transform .3s}
.play::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,209,92,.9);animation:invite 1.6s ease-out infinite;pointer-events:none}
@keyframes invite{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.55);opacity:0}}
.play svg{animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
.stylename{position:absolute;left:12px;bottom:10px;z-index:4;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.seg{display:flex;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.92);color:#111}
.segc{position:absolute;right:12px;bottom:10px;z-index:6}
.time{position:absolute;left:14px;right:180px;bottom:20px;z-index:5;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;opacity:0;transform:translateY(10px);transition:.35s;pointer-events:none;white-space:nowrap}
.bar{flex:1;position:relative;height:22px;cursor:pointer;touch-action:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:rgba(255,255,255,.3)}
.bar i{position:absolute;left:0;top:9px;height:4px;width:0;border-radius:4px;background:#fff}
.bar b{position:absolute;top:4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.rail{position:absolute;right:8px;top:calc(var(--top) + 62px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:.5px solid rgba(255,255,255,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dotst{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;position:relative;
  background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.22);transition:transform .25s,border-color .25s,background .25s}
.dotst.on{border:1.5px solid var(--gold);background:rgba(255,209,92,.18);transform:scale(1.06);box-shadow:0 0 12px rgba(255,209,92,.45)}
.dname{position:absolute;right:calc(100% + 16px);top:50%;margin-top:-13px;height:26px;line-height:26px;padding:0 11px;border-radius:999px;white-space:nowrap;font-size:12.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.42);border:.5px solid rgba(255,255,255,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-shadow:0 1px 3px rgba(0,0,0,.5);opacity:0}
.dotst.on .dname{color:#1a1300;background:linear-gradient(180deg,#FFE08A,#F2A91C);border-color:transparent;text-shadow:none}
@keyframes nameIn{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
#app:not(.playing) .rail .dname{animation:nameIn .5s cubic-bezier(.2,.8,.2,1) both}
#app:not(.playing) .rail .dotst:nth-child(2) .dname{animation-delay:.07s}#app:not(.playing) .rail .dotst:nth-child(3) .dname{animation-delay:.14s}#app:not(.playing) .rail .dotst:nth-child(4) .dname{animation-delay:.21s}
.more{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;background:rgba(255,255,255,.10)}
.top,.rail,.stylename{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.playing .top{transform:translateY(-120px);opacity:0}.playing .rail{transform:translateX(90px);opacity:0}
.playing .stylename{transform:translateY(70px);opacity:0}.playing .play{opacity:0;transform:scale(.6);pointer-events:none}
.playing .time{opacity:1;transform:none;pointer-events:auto}
.panel{position:absolute;left:10px;right:10px;bottom:calc(var(--bottom) + 10px);top:calc(75% + 10px);border-radius:30px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:4}
.line{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.dots{display:flex;gap:8px}
.dot{width:24px;height:24px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.dot.on{outline:2px solid #fff;outline-offset:2px}
.tpick{display:flex;align-items:center;gap:5px;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,209,92,.6);font-size:13px;font-weight:700;color:var(--gold);cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tile{position:relative;height:108px;padding-bottom:22px;border-radius:18px;overflow:hidden;background:#0b0b0e;border:1px solid rgba(255,255,255,.14);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.tile video{position:absolute;left:0;right:0;top:0;width:100%;height:calc(100% - 22px);object-fit:cover}
.tile.on{border:2px solid var(--gold);box-shadow:0 0 14px rgba(255,209,92,.5)}
.tile small{position:absolute;left:0;right:0;bottom:4px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
.tile .tt{font-size:13px;font-weight:700;color:#ccc;margin-top:-14px;line-height:1.25;padding:0 8px}
.tile .gold-t{font-size:22px;font-weight:800;background:linear-gradient(180deg,#FFF6C8,#FFD54F 40%,#F2A91C);-webkit-background-clip:text;color:transparent;margin-top:-14px}
.cta{margin-top:auto;border:0;border-radius:20px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;
  background:linear-gradient(180deg,#FFE08A,#F5B52B);color:#2a1d00;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(245,181,43,.35)}
.ghost{border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:13px;font-weight:700;font-size:15px;background:rgba(255,255,255,.10);color:#fff;cursor:pointer;width:100%}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:7;opacity:0;pointer-events:none;transition:.3s}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(var(--bottom) + 10px);border-radius:32px;padding:18px 14px;z-index:8;transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow:auto}
.open .veil{opacity:1;pointer-events:auto}.sheet.show{transform:none}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between}
.x{cursor:pointer;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;text-align:center;font-size:11px;font-weight:600}
.grid .dotst{margin:0 auto 5px;width:50px;height:50px;font-size:20px}
.tar{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:8px;font-size:14px;font-weight:600;cursor:pointer}
.tar small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}.tar b{color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.4}
/* full screens: uploading, error, accepted */
.screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:calc(var(--top) + 30px) 20px calc(var(--bottom) + 20px);background:#000}
.screen.show{display:flex}
.screen .glow{z-index:-1}
.h{font-size:20px;font-weight:700}.p{font-size:14px;color:var(--muted);line-height:1.45;max-width:320px}
.chip{border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
.ring{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) var(--p,0%),rgba(255,255,255,.14) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:rgba(20,20,22,.9);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:30px}.ring small{font-size:11px;color:var(--muted)}
.check{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(52,199,89,.18);border:2px solid #34c759;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.warn{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,159,10,.16);border:2px solid #ff9f0a;font-size:36px;font-weight:800;color:#ff9f0a}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.bottom{width:100%;max-width:380px;margin-top:auto;display:flex;flex-direction:column;gap:10px}
.thumb{width:96px;aspect-ratio:9/16;border-radius:16px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.5);background:#222}
</style>
<style id="edCss">
.btnrow{margin:auto 0;display:flex;flex-direction:column;gap:12px}.btnrow .cta{width:100%;margin:0}.btnrow .ghost{width:100%;padding:10px 6px;font-size:13.5px;line-height:1.2}
#edit{position:absolute;inset:0;z-index:30;background:#000;display:none}
#edit.show{display:block}
.evid{position:absolute;top:0;left:0;right:0;height:58%;overflow:hidden;border-radius:0 0 26px 26px;background:#111}
.evid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.ov-title{position:absolute;left:4%;right:4%;top:calc(var(--top) + 46px);text-align:center;font-weight:900;font-size:26px;line-height:1.05;letter-spacing:.02em;
  text-transform:uppercase;background:var(--fill);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 16px var(--glow));transition:opacity .2s;touch-action:none;cursor:grab;z-index:2}
.ov-chip{position:absolute;top:40%;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;text-transform:uppercase;touch-action:none;cursor:grab;z-index:2}
.ov-cap{position:absolute;left:6%;right:6%;text-align:center;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);transition:top .25s,font-size .25s;touch-action:none;cursor:grab;z-index:2}
.dragging{outline:1.5px dashed var(--gold);outline-offset:4px;border-radius:8px;transition:none!important}
.ov-cap .k{background:var(--box);color:#111;padding:0 .2em;border-radius:.2em;text-shadow:none}
.etime{position:absolute;left:12px;right:12px;bottom:8px;display:flex;gap:8px;align-items:center;font-size:11px;font-weight:600;z-index:3}
.eplay{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.eclose{position:absolute;top:calc(var(--top) + 8px);left:12px;z-index:4;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;
  color:#2a1d00;background:linear-gradient(110deg,#F5B52B 20%,#FFF3C4 45%,#FFE08A 55%,#F5B52B 80%);background-size:250% 100%;
  border:1px solid rgba(255,240,190,.9);box-shadow:0 0 14px rgba(255,201,60,.6);animation:shimmer 2.2s linear infinite}
@keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
#edit.fxmode .evid{height:72%}#edit.fxmode .epane{top:calc(72% + 6px)}
#edit.fxmode .elist{flex:none;max-height:76px}
.autob{border-radius:999px;padding:6px 16px;font-size:12px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.92);color:#111}
.autob.on{background:linear-gradient(180deg,#FFE08A,#F5B52B);color:#2a1d00;box-shadow:0 0 12px rgba(245,181,43,.6)}
#eSend{padding:11px;font-size:14px;border-radius:16px}
.epane{position:absolute;left:8px;right:8px;top:calc(58% + 6px);bottom:calc(var(--bottom) + 8px);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:8px}
.etabs{display:flex;border-radius:999px;padding:3px;background:rgba(0,0,0,.25)}
.etabs span{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:7px 0;border-radius:999px;color:var(--muted);position:relative;cursor:pointer}
.etabs .on{background:rgba(255,255,255,.92);color:#111}
.elist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.it{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:13px;cursor:pointer}
.it.cur{background:rgba(255,209,92,.14);box-shadow:inset 0 0 0 1px rgba(255,209,92,.6)}
.it.gone{opacity:.4;text-decoration:line-through}
.tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px}
.grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix{color:rgba(255,255,255,.6);font-size:15px;padding:0 4px;cursor:pointer}
.einput{display:flex;gap:6px;align-items:center}.einput input{flex:1;min-width:0;border-radius:12px;padding:9px 10px;font-size:14px;background:rgba(0,0,0,.35);color:#fff;border:1.5px solid var(--gold);outline:0}
.mini{border:0;border-radius:10px;padding:8px 10px;font-weight:700;font-size:12px;cursor:pointer}
.mini.ok{background:var(--gold);color:#2a1d00}.mini.no{background:rgba(255,255,255,.12);color:#fff}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tool{border-radius:12px;padding:5px 2px;text-align:center;font-size:9.5px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);line-height:1.25;position:relative;cursor:pointer}
.tool b{display:block;font-size:14px;margin-bottom:1px}.tool.on{background:rgba(255,209,92,.16);border-color:rgba(255,209,92,.7);color:var(--gold)}
@keyframes chg{0%,100%{box-shadow:0 0 0 1.5px rgba(255,209,92,.95),0 0 14px rgba(255,209,92,.6)}50%{box-shadow:0 0 0 1px rgba(255,209,92,.25)}}
.chg{animation:chg 1s ease-in-out infinite}
.bdg{font-style:normal;position:absolute;top:-7px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#FFD15C;color:#111;font-size:11px;font-weight:800;line-height:19px;text-align:center;box-shadow:0 0 0 2px #1a1a1a}
.words{display:flex;flex-wrap:wrap;gap:6px}.w{padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;cursor:pointer}.w.y{background:var(--box);color:#111}
.row2{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.opt{display:flex;gap:6px}.opt span{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:rgba(255,255,255,.08);font-size:12px;font-weight:600;cursor:pointer}.opt .on{background:rgba(255,255,255,.92);color:#111}
input[type=range]{width:100%;accent-color:#FFD15C}
.hint{font-size:11.5px;color:var(--muted)}
.rv{display:flex;flex-direction:column;gap:6px;overflow:auto}.rvi{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:12.5px;line-height:1.35;cursor:pointer}
.rvi s{color:rgba(255,255,255,.45)}.rvi em{font-style:normal;color:var(--gold)}.rvi .go{margin-left:auto;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;top:40%;z-index:40;border-radius:22px;padding:18px;text-align:center;font-size:14px;line-height:1.45;display:none}
</style>
<style>
.mat h3{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.pickv{width:100%;border:0;border-radius:18px;padding:15px;font-weight:700;font-size:15px;cursor:pointer;background:rgba(255,255,255,.92);color:#111}
.pickv.done{background:rgba(52,199,89,.2);color:#fff;border:1px solid rgba(52,199,89,.7)}
.mlabel{font-size:13px;font-weight:700;margin:14px 0 6px}.msub{font-size:11.5px;color:var(--muted);margin:-2px 0 8px}
.addp{border:1.5px dashed rgba(255,255,255,.35);border-radius:16px;padding:11px;display:flex;gap:10px;align-items:center;font-size:13px;background:rgba(255,255,255,.05);cursor:pointer}
.addp b{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumbs div{position:relative;width:54px;height:54px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.thumbs i{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#333;font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mnote{width:100%;min-height:64px;border-radius:14px;padding:10px 12px;font:14px/1.4 -apple-system,"Segoe UI",sans-serif;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.2);resize:none;outline:0}
.merr{color:#ff9f0a;font-size:12.5px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div id="app">
  <div class="glow" id="glow"></div>
  <div class="stage">
    <video class="frame" id="vAfter" playsinline preload="metadata"></video>
    <video class="frame" id="vBefore" playsinline preload="metadata" style="opacity:0"></video>
    <div class="empty" id="empty" style="display:none"></div>
    <div class="play glass" id="play"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg></div>
    <div class="time" id="time"><div class="bar" id="bar"><i id="fill"></i><b id="knob"></b></div><span id="sec">0:00</span></div>
    <div class="top"><div class="pill glass">Reels Монтаж</div><div class="pill glass" id="bal"><span class="gold">●</span> <span id="balText">…</span></div></div>
    <div class="stylename glass" id="sname"></div>
    <div class="seg glass segc"><button data-k="before" id="bBefore"></button><button class="on" data-k="after" id="bAfter"></button></div>
  </div>
  <div class="rail" id="rail"></div>
  <div class="panel glass">
    <div class="line" id="colorLine"><span id="colorLbl"></span><span class="dots" id="dots"></span></div>
    <div class="line" id="tfxLine" style="display:none"><span id="tfxLbl"></span><span class="tpick" id="tfxPick"></span></div>
    <div class="btnrow"><button class="ghost" id="tryDemo"></button><button class="cta" id="send"></button></div>
  </div>
  <input type="file" id="file" style="display:none">
  <div class="veil" id="veil"></div>
  <div class="sheet glass" id="tfxSheet"><h3><span id="tfxTitle"></span><span class="x" data-close>✕</span></h3><div class="note" id="tfxHint"></div><div class="tgrid" id="tfxGrid"></div></div>
  <div class="sheet glass" id="allStyles"><h3><span id="allTitle"></span><span class="x" data-close>✕</span></h3><div class="grid" id="grid"></div></div>
  <div class="sheet glass mat" id="matSheet">
    <h3><span id="mTitle"></span><span class="x" data-close>✕</span></h3>
    <button class="pickv" id="mVideo"></button>
    <div class="mlabel" id="mExtra"></div><div class="msub" id="mExtraSub"></div>
    <div class="addp" id="mAdd"><b>＋</b><div id="mAddText"></div></div>
    <div class="thumbs" id="mThumbs"></div>
    <div class="mlabel" id="mNoteLbl"></div>
    <textarea class="mnote" id="mNote" maxlength="600"></textarea>
    <div class="merr" id="mErr"></div>
    <button class="cta" id="mSend" style="width:100%;margin-top:6px"></button>
  </div>
  <input type="file" id="photos" accept="image/*" multiple style="display:none">

  <div class="screen" id="upScreen"><div class="glow" id="upGlow"></div>
    <video class="thumb" id="upThumb" muted playsinline></video>
    <div class="chip glass" id="upChip"></div>
    <div class="ring" id="ring"><div><b id="upPct">0%</b><small id="upWord"></small></div></div>
    <div class="h" id="upTitle"></div><div class="p" id="upInfo"></div>
    <div class="bottom"><button class="ghost" id="upCancel"></button></div>
  </div>
  <div class="screen" id="errScreen"><div class="glow" id="errGlow"></div>
    <div class="warn">!</div><div class="h" id="errTitle"></div><div class="p" id="errText"></div>
    <div class="bottom"><button class="cta" id="errOther"></button><button class="ghost" id="errBack"></button></div>
  </div>
  <div class="screen" id="okScreen"><div class="glow" id="okGlow"></div>
    <div class="check"><svg width="42" height="42" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#34c759" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="h" id="okTitle"></div><div class="p" id="okText"></div>
    <div class="bottom"><button class="cta" id="okChat"></button></div>
  </div>
</div>
<script>
const tg = window.Telegram && Telegram.WebApp;
const $ = id => document.getElementById(id);
// Nov 12: on GitHub Pages the link says where the bot is (?api=https://...); here it is this server.
const API = (() => { const a = new URLSearchParams(location.search).get("api") || ""; return /^https:\/\/[^/?#]+$/.test(a) ? a : ""; })();
const HOSTED = !!API;
function demoUrl(id, name) { return HOSTED ? `demos/${id}/${name}` : `/demo/${id}/${name}`; }
window.demoUrl = demoUrl;
const ICONS = {motion_pro: "⚡", explainer: "📊", animation: "🎬", duel: "⚔️"};
function icon(s) { const m = s.name.match(/^(\S+)\s+/); return m && !/[0-9A-Za-zА-яЁёӘәҒғҚқҢңӨөҰұҮүІіҺһ]/.test(m[1]) ? m[1] : (ICONS[s.id] || "✨"); }
function label(s) { const m = s.name.match(/^(\S+)\s+(.*)$/); return m && !/[0-9A-Za-zА-яЁёӘәҒғҚқҢңӨөҰұҮүІіҺһ]/.test(m[1]) ? m[2] : s.name; }
let D = null, T = {}, style = null, color = "gold", cur = null, dragging = false, cancelled = false, tfx = "auto";

function haptic(kind) { try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
function fmt(t) { t = Math.floor(t || 0); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
async function api(path, body) {
  const r = await fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json().catch(() => ({ok: false}));
}

async function boot() {
  if (tg) { try { tg.ready(); tg.expand(); if (tg.requestFullscreen && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) tg.requestFullscreen();
    tg.setHeaderColor && tg.setHeaderColor("#000000"); tg.setBackgroundColor && tg.setBackgroundColor("#000000"); } catch (e) {} }
  D = await api("/api/init", {initData: tg ? tg.initData : ""});
  if (!D.ok) { $("empty").style.display = "flex"; $("empty").textContent = "Ботта /start басыңыз · Нажмите /start в боте"; return; }
  T = D.t; document.documentElement.lang = D.lang;
  // Nov 12: opened from the chat's "✏️ Түзету" (?order=1031): straight into the editor on that order
  const ORDER = new URLSearchParams(location.search).get("order") || "";
  if (/^\d{1,9}$/.test(ORDER)) {
    $("empty").style.display = "flex"; $("empty").textContent = T.ed_preparing;
    try {
      await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = HOSTED ? "editor.js" : "/app/editor.js"; sc.onload = ok; sc.onerror = no; document.body.append(sc); });
      const failed = await openOrder(+ORDER);
      if (failed) $("empty").textContent = failed; else $("empty").style.display = "none";
    } catch (e) { $("empty").textContent = T.app_failed; }
    return;
  }
  if (HOSTED) {  // Nov 12: a version still rendering on the laptop is not on the site yet (a black screen)
    const have = await fetch("demos/manifest.json", {cache: "no-store"}).then(r => r.json()).catch(() => null);
    if (have) D.styles.forEach(s => { const f = have[s.id] || [];
      s.before = s.before && f.includes("before"); s.after = s.after && f.includes("after");
      s.colors = (s.colors || []).filter(c => f.includes("after_" + c)); s.looks = (s.looks || []).filter(x => f.includes("after_fx_" + x));
      s.tunes = Math.min(s.tunes || 0, ["music_1", "music_2", "music_3"].filter(x => f.includes(x)).length);
      s.plan = s.plan && f.includes("plan"); });
  }
  $("bBefore").textContent = T.app_before; $("bAfter").textContent = T.app_after;
  $("colorLbl").textContent = T.app_color; $("send").textContent = T.app_send; $("tryDemo").textContent = T.btn_try_demo;
  $("tryDemo").onclick = async () => {  // the editor's code arrives only when it is needed
    if (!window.openTry) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = HOSTED ? "editor.js" : "/app/editor.js"; sc.onload = ok; sc.onerror = no; document.body.append(sc); });
    openTry();
  };
  $("allTitle").textContent = T.app_all_styles; $("tarTitle").textContent = T.app_tariffs;
  $("balText").textContent = D.balance + " " + T.app_videos;
  $("tfxLbl").textContent = T.app_text_fx; $("tfxTitle").textContent = T.app_text_fx; $("tfxHint").textContent = T.app_text_fx_hint;
  $("tfxPick").onclick = () => { haptic(); openLooks(); };
  renderRail(); renderColors(); renderTariffs(); renderLooks();
  pick(D.styles[0]);
}

function renderRail() {
  const rail = $("rail"); rail.innerHTML = "";
  D.styles.slice(0, 4).forEach(s => {
    const d = document.createElement("div"); d.className = "dotst"; d.dataset.id = s.id; d.textContent = icon(s);
    // Nov 12 (user): while the video is stopped every style's name stands beside its button (slides in from the right)
    const nm = document.createElement("span"); nm.className = "dname"; nm.textContent = label(s); d.append(nm);
    d.onclick = () => { haptic(); pick(s); }; rail.append(d);
  });
  if (D.styles.length > 4) { const m = document.createElement("div"); m.className = "more"; m.textContent = "⌄"; m.onclick = () => open("allStyles"); rail.append(m); }
  const grid = $("grid"); grid.innerHTML = "";
  D.styles.forEach(s => {
    const c = document.createElement("div"); c.innerHTML = `<div class="dotst" data-id="${s.id}">${icon(s)}</div>`;
    c.append(document.createTextNode(label(s))); c.onclick = () => { pick(s); close(); }; grid.append(c);
  });
}
function renderColors() {
  const dots = $("dots"); dots.innerHTML = "";
  D.colors.forEach(c => {
    const d = document.createElement("span"); d.className = "dot" + (c.id === color ? " on" : ""); d.style.background = c.swatch;
    d.onclick = () => { haptic(); color = c.id; if (tfx !== "auto") { tfx = "auto"; renderPick(); } renderColors(); showColour(); }; dots.append(d);
  });
}
// ---------- "Мәтін эффектісі": the title look (Nov 12); previews load only when the sheet opens
function lookName(id) { return T["tfx_" + id] || id; }
function renderLooks() {
  const grid = $("tfxGrid"); grid.innerHTML = "";
  ["auto", ...(D.looks || []), "classic"].forEach(id => {
    const t = document.createElement("div"); t.className = "tile" + (id === tfx ? " on" : ""); t.dataset.id = id;
    if (id === "auto") t.innerHTML = `<div class="tt">✨ ${T.tfx_auto_hint}</div>`;
    else if (id === "classic") t.innerHTML = `<div class="gold-t">МОНТАЖ</div>`;
    else t.innerHTML = `<video muted loop playsinline preload="none" poster="${HOSTED ? "tfx" : "/app/tfx"}/${id}.jpg" data-src="${HOSTED ? "tfx" : "/app/tfx"}/${id}.mp4"></video>`;
    t.insertAdjacentHTML("beforeend", `<small>${lookName(id)}</small>`);
    t.onclick = () => { haptic(); tfx = id; renderPick(); close(); stopLooks(); showColour(); };
    grid.append(t);
  });
  renderPick();
}
function renderPick() {
  $("tfxPick").textContent = (tfx === "auto" ? "✨ " : "") + lookName(tfx) + " ›";
  document.querySelectorAll("#tfxGrid .tile").forEach(t => t.classList.toggle("on", t.dataset.id === tfx));
}
function openLooks() {
  open("tfxSheet");
  document.querySelectorAll("#tfxGrid video").forEach(v => { if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); });
}
function stopLooks() { document.querySelectorAll("#tfxGrid video").forEach(v => v.pause()); }
function afterSrc(s) {  // Nov 12: a chosen title look shows its own version of the demo
  if (s.tfx && tfx !== "auto" && s.looks && s.looks.includes(tfx)) return demoUrl(s.id, `after_fx_${tfx}`);
  return s.colorPick && s.colors && s.colors.includes(color) ? demoUrl(s.id, `after_${color}`) : demoUrl(s.id, "after");
}
function showColour() {  // the demo in the chosen colour, from the same second (Nov 11)
  if (!style || !style.after) return;
  const vA = $("vAfter"), src = afterSrc(style) + ".mp4";
  if (vA.src.endsWith(src)) return;
  const t = cur ? cur.currentTime : 0, playing = cur && !cur.paused;
  setKind("after"); vA.poster = afterSrc(style) + ".jpg"; vA.src = src;
  vA.onloadedmetadata = () => { vA.currentTime = Math.min(t, (vA.duration || t + 1) - 0.1); if (playing) vA.play(); vA.onloadedmetadata = null; };
}
function renderTariffs() {
  const list = $("tarList"); list.innerHTML = "";
  D.tariffs.forEach(x => {
    const row = document.createElement("div"); row.className = "tar";
    row.innerHTML = `<div>${x.name}<small>${x.videos} ${T.app_video_word} · ${x.days} ${T.app_days}</small></div><b>${x.price.toLocaleString("ru-RU")} ₸</b>`;
    row.onclick = async () => { haptic("medium"); const r = await api("/api/tariff", {token: D.token, id: x.id}); if (r.ok && tg) tg.close(); };
    list.append(row);
  });
}

function pick(s) {
  style = s; stop(); cur = null;  // a new style always starts from its first second
  document.querySelectorAll(".dotst").forEach(d => d.classList.toggle("on", d.dataset.id === s.id));
  $("sname").textContent = icon(s) + " " + label(s);
  const vA = $("vAfter"), vB = $("vBefore");
  vA.poster = s.after ? afterSrc(s) + ".jpg" : ""; vB.poster = s.before ? demoUrl(s.id, "before.jpg") : "";
  vA.src = s.after ? afterSrc(s) + ".mp4" : ""; vB.src = s.before ? demoUrl(s.id, "before.mp4") : "";
  vA.load(); vB.load();
  const still = s.after ? demoUrl(s.id, "after.jpg") : (s.before ? demoUrl(s.id, "before.jpg") : "");
  if (still) $("glow").style.backgroundImage = `url(${still})`;
  const any = s.after || s.before;
  $("empty").style.display = any ? "none" : "flex"; $("empty").textContent = any ? "" : s.name;
  $("play").style.display = any ? "flex" : "none";
  $("tryDemo").style.display = s.plan && s.before ? "" : "none";
  $("tfxLine").style.display = s.tfx ? "" : "none";
  $("colorLine").style.display = s.colorPick ? "" : "none";
  setKind(s.after ? "after" : "before");

}
$("vAfter").addEventListener("error", () => { const v = $("vAfter");
  if (style && style.after && !/\/after\.mp4$/.test(v.src)) { v.poster = demoUrl(style.id, "after.jpg"); v.src = demoUrl(style.id, "after.mp4"); } });
function setKind(kind) {
  document.querySelectorAll(".segc button").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
  const next = kind === "after" ? $("vAfter") : $("vBefore");
  if (cur && next !== cur) {
    const t = cur.currentTime, playing = !cur.paused; cur.pause();
    if (next.duration) next.currentTime = Math.min(t, next.duration - 0.1); else next.currentTime = t;
    if (playing) next.play();
  }
  $("vBefore").style.opacity = kind === "before" ? 1 : 0; cur = next;
}
document.querySelectorAll(".segc button").forEach(b => b.onclick = () => { haptic(); setKind(b.dataset.k); });
function play() { if (!cur || !cur.src) return; $("app").classList.add("playing"); cur.play(); }
function stop() { $("vAfter").pause(); $("vBefore").pause(); $("app").classList.remove("playing"); }
$("play").onclick = play;
["vAfter", "vBefore"].forEach(id => {
  const v = $(id);
  v.onclick = () => { if ($("app").classList.contains("playing")) stop(); };
  v.ontimeupdate = () => { if (v !== cur || dragging) return; show(v.currentTime / (v.duration || 1)); $("sec").textContent = fmt(v.currentTime); };
  v.onended = () => { v.currentTime = 0; stop(); };
});
function show(f) { f = Math.max(0, Math.min(1, f)); $("fill").style.width = f * 100 + "%"; $("knob").style.left = f * 100 + "%"; }
const bar = $("bar");
function seek(e) { const r = bar.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  show(f); if (cur && cur.duration) { cur.currentTime = f * cur.duration; $("sec").textContent = fmt(cur.currentTime); } }
bar.onpointerdown = e => { dragging = true; bar.setPointerCapture(e.pointerId); seek(e); };
bar.onpointermove = e => { if (dragging) seek(e); };
bar.onpointerup = () => { dragging = false; };
const fitTime = () => { $("time").style.right = (document.querySelector(".segc").offsetWidth + 24) + "px"; };
window.addEventListener("resize", fitTime); setTimeout(fitTime, 300);

function open(id) { $("app").classList.add("open"); $(id).classList.add("show"); }
function close() { stopLooks(); $("app").classList.remove("open"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show")); }
$("veil").onclick = close; document.querySelectorAll("[data-close]").forEach(x => x.onclick = close);
$("bal").onclick = () => { $("tarNote").style.display = "none"; open("tariffs"); };

// ---------- send a video
let started = null;
let starting = false;
$("send").onclick = async () => {
  if (starting) return; starting = true; setTimeout(() => { starting = false; }, 2500);  // Nov 13: one tap = one start
  haptic("medium"); stop();
  started = await api("/api/start", {token: D.token, style: style.id, color, title_fx: style.tfx ? tfx : undefined});
  if (!started.ok) {
    if (started.need === "tariffs") { $("tarNote").textContent = T.app_no_balance; $("tarNote").style.display = "block"; open("tariffs"); }
    return;
  }
  if (style.materials) return openMaterials();
  const input = $("file"); input.accept = style.accept; input.multiple = style.files > 1; input.value = ""; input.click();
};

// ---------- the client's own photos/logo + a short note (Nov 12); Duel needs all its videos
let mVideos = [], mPhotos = [];
function openMaterials() {
  mVideos = []; mPhotos = []; $("mNote").value = ""; $("mErr").textContent = "";
  $("mTitle").textContent = T.app_send; $("mExtra").textContent = T.mat_extra; $("mExtraSub").textContent = T.mat_extra_sub;
  $("mAddText").textContent = T.mat_add; $("mNoteLbl").textContent = T.mat_note; $("mNote").placeholder = T.mat_note_hint;
  $("mSend").textContent = T.mat_send; renderMat(); open("matSheet");
}
function renderMat() {
  const need = style.files;
  $("mVideo").textContent = need > 1 ? `🎬 ${T.mat_videos} ${mVideos.length}/${need}` : (mVideos.length ? "✅ " + T.mat_video_ok : "🎬 " + T.mat_pick_video);
  $("mVideo").classList.toggle("done", mVideos.length >= need);
  $("mThumbs").innerHTML = "";
  mPhotos.forEach((f, i) => { const d = document.createElement("div"); d.style.backgroundImage = `url(${URL.createObjectURL(f)})`;
    const x = document.createElement("i"); x.textContent = "✕"; x.onclick = () => { mPhotos.splice(i, 1); renderMat(); }; d.append(x); $("mThumbs").append(d); });
  $("mAdd").style.display = mPhotos.length >= 5 ? "none" : "flex";
}
$("mVideo").onclick = () => { const input = $("file"); input.accept = style.accept; input.multiple = style.files > 1; input.value = ""; input.dataset.mat = "1"; input.click(); };
$("mAdd").onclick = () => { $("photos").value = ""; $("photos").click(); };
$("photos").onchange = () => { mPhotos = mPhotos.concat(Array.from($("photos").files)).slice(0, 5); renderMat(); };
function shrink(file) { return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext("2d"); g.drawImage(img, 0, 0, c.width, c.height);
  c.toBlob(b => res(b || file), /png/i.test(file.type) ? "image/png" : "image/jpeg", .9); }; img.onerror = () => res(file); img.src = URL.createObjectURL(file); }); }
$("mSend").onclick = async () => {
  const need = style.files;
  if (mVideos.length < need) { $("mErr").textContent = need > 1 ? T.mat_need_videos.replace("%N%", need).replace("%K%", need - mVideos.length) : T.mat_pick_video; return; }
  $("mErr").textContent = ""; $("mSend").disabled = true;
  try {
    if (mPhotos.length || $("mNote").value.trim()) {
      const fd = new FormData(); fd.append("token", D.token); fd.append("note", $("mNote").value.trim());
      for (const f of mPhotos) { const b = await shrink(f); fd.append("file", b, (f.name || "photo").replace(/\.[^.]+$/, "") + (b.type === "image/png" ? ".png" : ".jpg")); }
      const r = await (await fetch(API + "/api/materials", {method: "POST", body: fd})).json().catch(() => ({ok: false}));
      if (!r.ok) throw new Error("materials");
    }
    close(); upload(mVideos);
  } catch (e) { $("mErr").textContent = T.app_failed; }
  finally { $("mSend").disabled = false; }
};
$("file").onchange = async () => {
  const files = Array.from($("file").files); if (!files.length) return;
  if ($("file").dataset.mat) {
    delete $("file").dataset.mat;
    const maxSec = style.max || 0, other = style.maxOther || maxSec;
    for (const f of files) { const len = await duration(f); f._len = len;
      if (maxSec && len && len > maxSec + 1) { $("mErr").textContent = T.app_too_long_text.replace("%LEN%", fmt(len)).replace("%MAX%", fmt(maxSec)); return; } }
    const next = style.files > 1 ? mVideos.concat(files).slice(0, style.files) : files.slice(0, 1);
    // Nov 12 (Duel): only one video (the speaker's) may be longer than the others' limit
    const longOnes = next.filter(f => other && f._len && f._len > other + 1);
    if (longOnes.length > 1) { const l = longOnes.sort((a, b) => a._len - b._len)[0]._len;
      $("mErr").textContent = T.app_too_long_text.replace("%LEN%", fmt(l)).replace("%MAX%", fmt(other)); return; }
    mVideos = next; $("mErr").textContent = ""; renderMat(); return;
  }
  const maxSec = style.max || 0;
  const len = await duration(files[0]);
  if (maxSec && len && len > maxSec + 1) return showError(T.app_too_long, T.app_too_long_text.replace("%LEN%", fmt(len)).replace("%MAX%", fmt(maxSec)));
  if (files.some(f => f.size > D.maxBytes)) return showError(T.app_failed, "");
  upload(files);
};
function duration(file) { return new Promise(res => { const v = document.createElement("video"); v.preload = "metadata";
  v.onloadedmetadata = () => res(v.duration); v.onerror = () => res(0); v.src = URL.createObjectURL(file); setTimeout(() => res(0), 4000); }); }
function showError(title, text) { $("errTitle").textContent = title; $("errText").textContent = text; $("errOther").textContent = T.app_other_video; $("errBack").textContent = T.app_back;
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("show")); $("errScreen").classList.add("show"); }
$("errOther").onclick = () => { $("errScreen").classList.remove("show"); $("file").value = ""; $("file").click(); };
$("errBack").onclick = () => { $("errScreen").classList.remove("show"); };
$("upCancel").onclick = () => { cancelled = true; $("upScreen").classList.remove("show"); };
$("okChat").onclick = () => { if (tg) tg.close(); };

// Nov 13: one piece to R2 with live byte progress (fetch cannot report upload progress)
function putPart(url, piece, onBytes) {
  return new Promise(res => { const x = new XMLHttpRequest(); let last = 0;
    x.open("PUT", url);
    x.upload.onprogress = e => { if (e.loaded > last) { onBytes(e.loaded - last); last = e.loaded; } };
    x.onload = () => res({etag: x.status >= 200 && x.status < 300 ? x.getResponseHeader("ETag") : null, sent: last});
    x.onerror = x.onabort = x.ontimeout = () => res({etag: null, sent: last});
    x.send(piece); });
}
async function upload(files) {
  cancelled = false;
  const token = started.upload, total = files.reduce((a, f) => a + f.size, 0); let sent = 0, t0 = Date.now();
  $("upTitle").textContent = T.app_uploading; $("upWord").textContent = ""; $("upCancel").textContent = T.app_cancel;
  $("upChip").textContent = icon(style) + " " + label(style);
  $("upThumb").src = URL.createObjectURL(files[0]) + "#t=0.1";
  $("upInfo").textContent = T.app_keep_open; $("upGlow").style.backgroundImage = $("glow").style.backgroundImage;
  $("upScreen").classList.add("show");
  const progress = add => { sent += add; const p = Math.floor(100 * sent / total); $("ring").style.setProperty("--p", p + "%"); $("upPct").textContent = p + "%";
    const speed = sent / Math.max(1, (Date.now() - t0) / 1000), left = (total - sent) / Math.max(speed, 1);
    $("upInfo").textContent = `${(sent / 1048576).toFixed(0)} / ${(total / 1048576).toFixed(0)} MB · ~${Math.ceil(left)} с ${T.app_left}`; };
  try {
    if (D.r2) {
      const plan = await (await fetch(`${API}/r2/start/${token}`, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({files: files.map(f => ({name: f.name, size: f.size}))})})).json();
      if (!plan.ok) throw new Error("start");
      const etags = [];
      for (let n = 0; n < files.length; n++) {
        const f = files[n], urls = plan.files[n].urls, tags = new Array(urls.length); let next = 0;
        async function putter() { while (next < urls.length) { if (cancelled) throw new Error("cancel"); const i = next++;
          const piece = f.slice(i * plan.part, Math.min((i + 1) * plan.part, f.size)); let ok = false;
          for (let k = 0; k < 6 && !ok; k++) { const r = await putPart(urls[i], piece, progress);
            if (r.etag) { tags[i] = r.etag; ok = true; progress(piece.size - r.sent); } else { progress(-r.sent); }
            if (!ok) await new Promise(res => setTimeout(res, 1500 * (k + 1))); }
          if (!ok) throw new Error("network"); } }
        await Promise.all(Array.from({length: Math.min(4, urls.length)}, putter)); etags.push(tags);
      }
      const j = await (await fetch(`${API}/r2/done/${token}/${plan.uid}`, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({files: etags.map(t => ({etags: t}))})})).json();
      if (!j.ok) throw new Error(j.error || "done");
    } else {
      const uid = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
      for (let n = 0; n < files.length; n++) {
        const f = files[n], count = Math.ceil(f.size / started.chunk); let next = 0;
        async function worker() { while (next < count) { if (cancelled) throw new Error("cancel"); const i = next++;
          const piece = f.slice(i * started.chunk, Math.min((i + 1) * started.chunk, f.size)); let ok = false;
          for (let k = 0; k < 6 && !ok; k++) { try { ok = (await fetch(`${API}/chunk/${token}/${uid}/${n}/${i}`, {method: "POST", body: piece})).ok; } catch (e) {}
            if (!ok) await new Promise(r => setTimeout(r, 1500 * (k + 1))); }
          if (!ok) throw new Error("network"); progress(piece.size); } }
        await Promise.all(Array.from({length: Math.min(started.parallel, count)}, worker));
      }
      const j = await (await fetch(`${API}/done/${token}/${uid}`, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({files: files.map(f => ({name: f.name, size: f.size}))})})).json();
      if (!j.ok) throw new Error(j.error || "done");
    }
    haptic("heavy");
    $("upScreen").classList.remove("show");
    $("okTitle").textContent = T.app_accepted; $("okText").textContent = T.app_accepted_text; $("okChat").textContent = T.app_to_chat;
    $("okGlow").style.backgroundImage = $("glow").style.backgroundImage; $("okScreen").classList.add("show");
  } catch (e) {
    if (String(e && e.message) === "cancel") return;
    showError(T.app_failed, e && e.message && !["network", "start", "done"].includes(e.message) ? e.message : "");
  }
}
boot();
</script>
